# Menjalankan seluruh aplikasi: PostgreSQL + backend Go + NGINX (frontend & proxy /api).
#
#   cp .env.example .env          # lalu ganti POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose run --rm backend /app/seed   # sekali saja, isi data contoh
#
# Buka http://localhost:8080

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zanafa}
      POSTGRES_USER: ${POSTGRES_USER:-zanafa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_PORT: "8081"
      DATABASE_URL: postgres://${POSTGRES_USER:-zanafa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-zanafa}?sslmode=disable
      MIGRASI_OTOMATIS: "true"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
